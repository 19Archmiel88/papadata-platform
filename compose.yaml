services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-papadata_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_ADMIN_DATABASE:-postgres}
      PAPADATA_DATABASE: ${PAPADATA_DATABASE:-papadata}
      PAPADATA_TEST_DATABASE: ${PAPADATA_TEST_DATABASE:-papadata_test}
      PAPADATA_MIGRATOR_PASSWORD: ${PAPADATA_MIGRATOR_PASSWORD:-change-me-local-only}
      PAPADATA_APP_PASSWORD: ${PAPADATA_APP_PASSWORD:-change-me-local-only}
      PAPADATA_TEST_PASSWORD: ${PAPADATA_TEST_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - papadata-postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - papadata-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    working_dir: /workspace
    entrypoint: ["sh", "/workspace/packages/database/scripts/migrate.sh"]
    command: ["up"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PAPADATA_DATABASE: ${PAPADATA_DATABASE:-papadata}
      PAPADATA_TEST_DATABASE: ${PAPADATA_TEST_DATABASE:-papadata_test}
      PAPADATA_MIGRATOR_USER: ${PAPADATA_MIGRATOR_USER:-papadata_migrator}
      PAPADATA_MIGRATOR_PASSWORD: ${PAPADATA_MIGRATOR_PASSWORD:-change-me-local-only}
      PAPADATA_APP_USER: ${PAPADATA_APP_USER:-papadata_app}
      PAPADATA_TEST_USER: ${PAPADATA_TEST_USER:-papadata_test}
      MIGRATION_DIR: /workspace/packages/database/migrations
    volumes:
      - ./:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@papadata/api", "start:local"]
    environment:
      API_PORT: ${API_PORT:-3001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PAPADATA_DATABASE: ${PAPADATA_DATABASE:-papadata}
      PAPADATA_APP_USER: ${PAPADATA_APP_USER:-papadata_app}
      PAPADATA_APP_PASSWORD: ${PAPADATA_APP_PASSWORD:-change-me-local-only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/api/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@papadata/worker", "start:local"]
    environment:
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3002}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PAPADATA_DATABASE: ${PAPADATA_DATABASE:-papadata}
      PAPADATA_APP_USER: ${PAPADATA_APP_USER:-papadata_app}
      PAPADATA_APP_PASSWORD: ${PAPADATA_APP_PASSWORD:-change-me-local-only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${WORKER_HEALTH_PORT:-3002}:${WORKER_HEALTH_PORT:-3002}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  papadata-postgres-data:
  papadata-redis-data:
