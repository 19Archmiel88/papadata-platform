name: Backend image release

on:
  workflow_dispatch:
  push:
    tags:
      - "backend-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [api, bff, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push immutable image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}/${SERVICE}"
          docker build -f "infra/production/${SERVICE}.Dockerfile" -t "${image}:${GITHUB_SHA}" .
          docker push "${image}:${GITHUB_SHA}"
          docker pull "${image}:${GITHUB_SHA}"
          reference="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${GITHUB_SHA}")"
          digest="${reference#*@}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
          exit-code: 0

      - name: Sign image with keyless OIDC
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: Attest CycloneDX SBOM
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --type cyclonedx \
            --predicate "sbom-${{ matrix.service }}.cdx.json" \
            "${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: Verify signature and attestation
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/backend-image-release.yml@refs/(heads|tags)/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}"
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/backend-image-release.yml@refs/(heads|tags)/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-release-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: error
