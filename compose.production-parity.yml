services:
  postgres-production:
    image: postgres:16.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: papadata
      POSTGRES_USER: papadata_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PAPADATA_APP_PASSWORD: ${PAPADATA_APP_PASSWORD:?PAPADATA_APP_PASSWORD is required}
      PAPADATA_PLATFORM_PASSWORD: ${PAPADATA_PLATFORM_PASSWORD:?PAPADATA_PLATFORM_PASSWORD is required}
      PAPADATA_TEST_PASSWORD: ${PAPADATA_TEST_PASSWORD:?PAPADATA_TEST_PASSWORD is required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - papadata_pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init/01-create-production-parity-roles.sh:/docker-entrypoint-initdb.d/001-create-runtime-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papadata_migrator -d papadata"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  redis-production:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --port 0
        --tls-port 6379
        --tls-cert-file /run/papadata-redis-tls/server.crt
        --tls-key-file /run/papadata-redis-tls/server.key
        --tls-ca-cert-file /run/papadata-redis-tls/ca.crt
        --tls-auth-clients no
        --requirepass "$${REDIS_PASSWORD}"
        --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - papadata_redis_data:/data
      - ./.runtime/backend-production-parity/redis-tls:/run/papadata-redis-tls:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --tls
          --cacert /run/papadata-redis-tls/ca.crt
          -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - papadata_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing local/papadata-artifacts
        mc anonymous set none local/papadata-artifacts
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:54317:4317"
      - "127.0.0.1:54318:4318"

  migrate-production:
    image: postgres:16.13-alpine
    working_dir: /workspace
    depends_on:
      postgres-production:
        condition: service_healthy
    volumes:
      - ./:/workspace:ro
    environment:
      POSTGRES_HOST: postgres-production
      POSTGRES_PORT: 5432
      PAPADATA_DATABASE: papadata
      PAPADATA_TEST_DATABASE: papadata_test
      PAPADATA_MIGRATOR_USER: papadata_migrator
      PAPADATA_MIGRATOR_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PAPADATA_APP_USER: papadata_app
      PAPADATA_PLATFORM_USER: papadata_platform
      PAPADATA_TEST_USER: papadata_test
      PAPADATA_TEST_PASSWORD: ${PAPADATA_TEST_PASSWORD:?PAPADATA_TEST_PASSWORD is required}
      MIGRATION_DIR: /workspace/packages/database/migrations
    entrypoint: ["sh", "/workspace/packages/database/scripts/migrate.sh"]
    command: ["up"]

  api-production:
    build:
      context: .
      dockerfile: infra/production/api.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    env_file: [.env.production-parity]
    depends_on:
      migrate-production:
        condition: service_completed_successfully
      redis-production:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "127.0.0.1:54000:4000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4000/readyz')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  bff-production:
    build:
      context: .
      dockerfile: infra/production/bff.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    env_file: [.env.production-parity]
    environment:
      NODE_ENV: production-parity
    depends_on:
      api-production:
        condition: service_healthy
      redis-production:
        condition: service_healthy
    ports:
      - "127.0.0.1:53001:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/readyz')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker-production:
    build:
      context: .
      dockerfile: infra/production/worker.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    env_file: [.env.production-parity]
    depends_on:
      migrate-production:
        condition: service_completed_successfully
      postgres-production:
        condition: service_healthy
      redis-production:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  papadata_pg_data:
  papadata_redis_data:
  papadata_minio_data:
