name: Release candidate build, sign, and certify

# P0-3 (Build Once / Immutable Artifacts): this is the ONE canonical
# pipeline that turns a Git SHA into a release candidate -- API, BFF,
# Worker and Web are each built exactly once, signed, attested, and bound
# together (with the runtime-config contract hash, migration set hash, and
# Terraform identity) into a single release manifest. The certified-local-
# parity job then runs the full production-parity acceptance suite against
# those four exact digests, pulled by digest and never rebuilt -- so a PASS
# here means "release candidate RC-X, these four immutable images, passed
# certified parity," not "the repository at this commit once passed CI."
# Nothing downstream (staging, production) may build these services again;
# it consumes the same digests this workflow already certified.
on:
  workflow_dispatch:
  push:
    tags:
      - "backend-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [api, bff, worker, web]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push immutable image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}/${SERVICE}"
          docker build -f "infra/production/${SERVICE}.Dockerfile" -t "${image}:${GITHUB_SHA}" .
          docker push "${image}:${GITHUB_SHA}"
          docker pull "${image}:${GITHUB_SHA}"
          reference="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${GITHUB_SHA}")"
          digest="${reference#*@}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
          exit-code: 0

      - name: Sign image with keyless OIDC
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: Attest CycloneDX SBOM
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest \
            --type cyclonedx \
            --predicate "sbom-${{ matrix.service }}.cdx.json" \
            "${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: Verify signature and attestation
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/backend-image-release.yml@refs/(heads|tags)/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}"
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/backend-image-release.yml@refs/(heads|tags)/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}"

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-release-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: error

      - name: Write image identity
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p image-identity
          cat > "image-identity/image-identity-${SERVICE}.json" <<JSON
          {"service": "${SERVICE}", "repository": "${{ steps.image.outputs.image }}", "digest": "${{ steps.image.outputs.digest }}"}
          JSON

      - name: Upload image identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-identity-${{ matrix.service }}-${{ github.sha }}
          path: image-identity/image-identity-${{ matrix.service }}.json
          if-no-files-found: error

  release-manifest:
    needs: build-sign-attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0

      - name: Download image identities
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-identity-*-${{ github.sha }}
          path: image-identity
          merge-multiple: true

      - name: Assemble release manifest
        run: |
          node tools/build-release-manifest-from-images.mjs \
            --api "$(jq -r '"\(.repository)@\(.digest)"' image-identity/image-identity-api.json)" \
            --bff "$(jq -r '"\(.repository)@\(.digest)"' image-identity/image-identity-bff.json)" \
            --worker "$(jq -r '"\(.repository)@\(.digest)"' image-identity/image-identity-worker.json)" \
            --web "$(jq -r '"\(.repository)@\(.digest)"' image-identity/image-identity-web.json)" \
            --git-sha "${{ github.sha }}"

      - name: Validate release manifest shape
        run: node tools/validate-release-manifest.mjs --skip-image-check

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest-${{ github.sha }}
          path: artifacts/release-manifest.json
          if-no-files-found: error

  certified-local-parity:
    needs: release-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @papadata/web exec playwright install --with-deps chromium

      - name: Download release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest-${{ github.sha }}
          path: artifacts

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull certified images by digest (no rebuild)
        run: |
          for service in api bff worker web; do
            reference="$(jq -r ".images.${service}.reference" artifacts/release-manifest.json)"
            docker pull "$reference"
          done

      - name: Certified release-candidate gate
        run: pnpm verify:release-candidate

      - name: Upload release-candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-evidence-${{ github.sha }}
          path: |
            artifacts/release-manifest.json
            artifacts/release-candidate-evidence.json
            artifacts/release-candidate-evidence
          if-no-files-found: error
