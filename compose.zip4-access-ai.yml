# Optional overlay. Never launched by apply.py. Use only with your explicitly chosen development stack.
services:
  api:
    environment:
      PAPADATA_AUTH_MAIL_ENABLED: ${PAPADATA_AUTH_MAIL_ENABLED:-false}
      PAPADATA_AUTH_MAIL_KEY_BASE64: ${PAPADATA_AUTH_MAIL_KEY_BASE64:-}
      PAPADATA_AUTH_MAIL_FROM: ${PAPADATA_AUTH_MAIL_FROM:-}
      PAPADATA_AUTH_MAIL_API_KEY: ${PAPADATA_AUTH_MAIL_API_KEY:-}
      PAPADATA_WEB_ORIGIN: ${PAPADATA_WEB_ORIGIN:-}
      PAPADATA_TERMS_VERSION: ${PAPADATA_TERMS_VERSION:-}
      PAPADATA_TERMS_URL: ${PAPADATA_TERMS_URL:-}
      PAPADATA_PRIVACY_VERSION: ${PAPADATA_PRIVACY_VERSION:-}
      PAPADATA_PRIVACY_URL: ${PAPADATA_PRIVACY_URL:-}
      PAPADATA_PAPA_REMOTE_ENABLED: ${PAPADATA_PAPA_REMOTE_ENABLED:-false}
      PAPADATA_PAPA_REMOTE_ENDPOINT: ${PAPADATA_PAPA_REMOTE_ENDPOINT:-}
      PAPADATA_PAPA_REMOTE_ALLOWED_HOSTS: ${PAPADATA_PAPA_REMOTE_ALLOWED_HOSTS:-}
      PAPADATA_PAPA_REMOTE_API_KEY: ${PAPADATA_PAPA_REMOTE_API_KEY:-}
      PAPADATA_PAPA_REMOTE_MODEL: ${PAPADATA_PAPA_REMOTE_MODEL:-}
      PAPADATA_PAPA_REMOTE_RESERVE_MINOR_PER_CALL: ${PAPADATA_PAPA_REMOTE_RESERVE_MINOR_PER_CALL:-50}
      AI_WORKSPACE_BUDGET_MINOR_PER_MONTH: ${AI_WORKSPACE_BUDGET_MINOR_PER_MONTH:-20000}
      AI_USER_BUDGET_MINOR_PER_MONTH: ${AI_USER_BUDGET_MINOR_PER_MONTH:-4000}
  worker:
    environment:
      PAPADATA_AUTH_MAIL_ENABLED: ${PAPADATA_AUTH_MAIL_ENABLED:-false}
      PAPADATA_AUTH_MAIL_KEY_BASE64: ${PAPADATA_AUTH_MAIL_KEY_BASE64:-}
      PAPADATA_AUTH_MAIL_FROM: ${PAPADATA_AUTH_MAIL_FROM:-}
      PAPADATA_AUTH_MAIL_API_KEY: ${PAPADATA_AUTH_MAIL_API_KEY:-}
      PAPADATA_WEB_ORIGIN: ${PAPADATA_WEB_ORIGIN:-}
      PAPADATA_ASSISTANT_RETENTION_ENABLED: ${PAPADATA_ASSISTANT_RETENTION_ENABLED:-false}
