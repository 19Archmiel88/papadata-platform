services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16.13}-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-papadata_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_ADMIN_DATABASE:-postgres}
      PAPADATA_DATABASE: ${PAPADATA_DATABASE:-papadata}
      PAPADATA_TEST_DATABASE: ${PAPADATA_TEST_DATABASE:-papadata_test}
      PAPADATA_MIGRATOR_PASSWORD: ${PAPADATA_MIGRATOR_PASSWORD:-change-me-local-only}
      PAPADATA_APP_PASSWORD: ${PAPADATA_APP_PASSWORD:-change-me-local-only}
      PAPADATA_PLATFORM_PASSWORD: ${PAPADATA_PLATFORM_PASSWORD:-change-me-local-only}
      PAPADATA_TEST_PASSWORD: ${PAPADATA_TEST_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - papadata-postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - papadata-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-papadata_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-papadata-local-dev-minio-secret-please-rotate-xyz}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - papadata-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
        mc mb --ignore-existing local/papadata-artifacts
        mc anonymous set none local/papadata-artifacts
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-papadata_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-papadata-local-dev-minio-secret-please-rotate-xyz}

  migrate:
    image: postgres:${POSTGRES_VERSION:-16.13}-alpine
    working_dir: /workspace
    entrypoint: ["sh", "/workspace/packages/database/scripts/migrate.sh"]
    command: ["up"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PAPADATA_DATABASE: ${PAPADATA_DATABASE:-papadata}
      PAPADATA_TEST_DATABASE: ${PAPADATA_TEST_DATABASE:-papadata_test}
      PAPADATA_MIGRATOR_USER: ${PAPADATA_MIGRATOR_USER:-papadata_migrator}
      PAPADATA_MIGRATOR_PASSWORD: ${PAPADATA_MIGRATOR_PASSWORD:-change-me-local-only}
      PAPADATA_APP_USER: ${PAPADATA_APP_USER:-papadata_app}
      PAPADATA_PLATFORM_USER: ${PAPADATA_PLATFORM_USER:-papadata_platform}
      PAPADATA_TEST_USER: ${PAPADATA_TEST_USER:-papadata_test}
      PAPADATA_TEST_PASSWORD: ${PAPADATA_TEST_PASSWORD:-change-me-local-only}
      MIGRATION_DIR: /workspace/packages/database/migrations
    volumes:
      - ./:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@papadata/api", "dev:production"]
    environment:
      API_PORT: ${API_PORT:-3001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PAPADATA_DATABASE: ${PAPADATA_DATABASE:-papadata}
      PAPADATA_APP_USER: ${PAPADATA_APP_USER:-papadata_app}
      PAPADATA_APP_PASSWORD: ${PAPADATA_APP_PASSWORD:-change-me-local-only}
      DATABASE_URL: postgres://${PAPADATA_APP_USER:-papadata_app}:${PAPADATA_APP_PASSWORD:-change-me-local-only}@postgres:5432/${PAPADATA_DATABASE:-papadata}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      PAPADATA_STORAGE_DRIVER: minio
      PAPADATA_STORAGE_BUCKET: papadata-artifacts
      PAPADATA_STORAGE_ENDPOINT: http://minio:9000
      PAPADATA_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-papadata_minio_admin}
      PAPADATA_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-papadata-local-dev-minio-secret-please-rotate-xyz}
      # Local-only placeholders below -- never valid in production (rejected there
      # by the placeholder-pattern / TLS checks in apps/api/src/production/config.ts).
      # BFF_INTERNAL_AUTH_ACTIVE_SECRET/ISSUER/AUDIENCE on the bff service below must
      # stay equal to these three, since the BFF signs the internal principal JWT that
      # this service verifies.
      PAPADATA_INFRASTRUCTURE_AUTH_TOKEN: ${PAPADATA_INFRASTRUCTURE_AUTH_TOKEN:-papadata-local-dev-infrastructure-auth-token-please-rotate-x}
      PAPADATA_API_AUTH_ISSUER: ${PAPADATA_API_AUTH_ISSUER:-papadata-local}
      PAPADATA_API_AUTH_AUDIENCE: ${PAPADATA_API_AUTH_AUDIENCE:-papadata-local-api}
      PAPADATA_API_AUTH_ACTIVE_SECRET: ${PAPADATA_API_AUTH_ACTIVE_SECRET:-papadata-local-dev-shared-internal-auth-secret-please-rotate}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-c30e039845737fb2189d2899d1599ea8481534688755b3595cb17ec2d09db30a}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/api/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  bff:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@papadata/bff", "dev:production"]
    environment:
      BFF_PORT: ${BFF_PORT:-3101}
      API_ORIGIN: http://api:${API_PORT:-3001}
      REDIS_URL: redis://redis:6379
      BFF_ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:-http://localhost:5173}
      BFF_PUBLIC_HOSTS: ${BFF_PUBLIC_HOSTS:-localhost:${BFF_PORT:-3101},127.0.0.1:${BFF_PORT:-3101}}
      # Local-only placeholders -- see the matching note on the api service above.
      BFF_COOKIE_SECRET: ${BFF_COOKIE_SECRET:-papadata-local-dev-bff-session-cookie-secret-please-rotate-x}
      BFF_CSRF_SECRET: ${BFF_CSRF_SECRET:-papadata-local-dev-bff-csrf-signing-secret-please-rotate-xyz}
      BFF_INTERNAL_AUTH_ACTIVE_SECRET: ${PAPADATA_API_AUTH_ACTIVE_SECRET:-papadata-local-dev-shared-internal-auth-secret-please-rotate}
      BFF_INTERNAL_AUTH_ISSUER: ${PAPADATA_API_AUTH_ISSUER:-papadata-local}
      BFF_INTERNAL_AUTH_AUDIENCE: ${PAPADATA_API_AUTH_AUDIENCE:-papadata-local-api}
    ports:
      - "${BFF_PORT:-3101}:${BFF_PORT:-3101}"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + (process.env.BFF_PORT || 3101) + '/healthz')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: ["pnpm", "--filter", "@papadata/worker", "start:local"]
    environment:
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3002}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PAPADATA_DATABASE: ${PAPADATA_DATABASE:-papadata}
      PAPADATA_APP_USER: ${PAPADATA_APP_USER:-papadata_app}
      PAPADATA_APP_PASSWORD: ${PAPADATA_APP_PASSWORD:-change-me-local-only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${WORKER_HEALTH_PORT:-3002}:${WORKER_HEALTH_PORT:-3002}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/healthcheck.mjs"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  papadata-postgres-data:
  papadata-redis-data:
  papadata-minio-data:
