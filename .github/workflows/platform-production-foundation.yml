name: Platform production foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  PAPADATA_CODE_SCANNING_AVAILABLE: ${{ github.event.repository.private == false || vars.PAPADATA_CODE_SCANNING_ENABLED == 'true' }}

jobs:
  production-parity-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare production-parity secrets and Redis TLS
        run: sh tools/prepare-production-parity.sh

      - name: Validate Compose configuration
        run: docker compose -f compose.production-parity.yml --env-file .env.production-parity config

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migration parity static gate
        run: pnpm verify:migration-parity

      - name: Clean database migration contract
        run: pnpm test:migrations

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability gate
        run: pnpm audit --prod --audit-level high

      - name: License policy gate
        run: |
          mkdir -p artifacts/backend-evidence
          pnpm licenses list --prod --json > artifacts/backend-evidence/licenses.json
          node tools/check-license-report.mjs artifacts/backend-evidence/licenses.json

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-evidence-${{ github.sha }}
          path: artifacts/backend-evidence
          if-no-files-found: warn

  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: 1

      - name: Generate repository CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: 0

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service: [api, bff, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: |
          docker build \
            -f "infra/production/${{ matrix.service }}.Dockerfile" \
            -t "papadata-${{ matrix.service }}:ci" \
            .

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: papadata-${{ matrix.service }}:ci
          scanners: vuln
          vuln-type: os,library
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: 1

      - name: Explain SARIF upload availability
        if: ${{ always() && env.PAPADATA_CODE_SCANNING_AVAILABLE != 'true' }}
        run: |
          echo "::notice title=SARIF upload skipped::Trivy enforcement ran in this job and the SARIF file remains available as an artifact. Enable GitHub Code Security first, then set repository variable PAPADATA_CODE_SCANNING_ENABLED=true."

      - name: Upload SARIF
        if: ${{ always() && env.PAPADATA_CODE_SCANNING_AVAILABLE == 'true' }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence-${{ matrix.service }}-${{ github.sha }}
          path: trivy-${{ matrix.service }}.sarif
          if-no-files-found: warn
