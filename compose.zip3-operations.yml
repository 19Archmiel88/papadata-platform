# Optional override, never started by apply.py. Combine ONLY with your chosen
# application Compose file. Supply credentials through that environment, not Git.
services:
  api:
    environment:
      PAPADATA_BILLING_MODE: ${PAPADATA_BILLING_MODE:-disabled}
      PAPADATA_BILLING_ALLOW_LIVE: ${PAPADATA_BILLING_ALLOW_LIVE:-false}
      PAPADATA_BILLING_RETURN_ORIGIN: ${PAPADATA_BILLING_RETURN_ORIGIN:-}
      PAPADATA_BILLING_PRICES_JSON: ${PAPADATA_BILLING_PRICES_JSON:-[]}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-}
      STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
      PAPADATA_INTEGRATION_SECRET_WRITE_ENABLED: ${PAPADATA_INTEGRATION_SECRET_WRITE_ENABLED:-false}
      PAPADATA_INTEGRATION_SECRET_PROJECT: ${PAPADATA_INTEGRATION_SECRET_PROJECT:-}
      PAPADATA_INTEGRATION_SECRET_LOCATION: ${PAPADATA_INTEGRATION_SECRET_LOCATION:-}
  worker:
    environment:
      PAPADATA_BILLING_MODE: ${PAPADATA_BILLING_MODE:-disabled}
      PAPADATA_BILLING_ALLOW_LIVE: ${PAPADATA_BILLING_ALLOW_LIVE:-false}
      PAPADATA_BILLING_RETURN_ORIGIN: ${PAPADATA_BILLING_RETURN_ORIGIN:-}
      PAPADATA_BILLING_PRICES_JSON: ${PAPADATA_BILLING_PRICES_JSON:-[]}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-}
      STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
