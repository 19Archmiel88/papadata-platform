version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      backend-runtime:
        patterns:
          - "@nestjs/*"
          - "@opentelemetry/*"
          - "@aws-sdk/*"
          - "@google-cloud/*"
          - "bullmq"
          - "redis"
          - "ioredis"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
