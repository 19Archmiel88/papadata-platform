server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # Source maps are stripped from this image at build time (see web.Dockerfile);
  # this is a second line of defense in case one ever slips through.
  location ~* \.map$ {
    return 404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Vite content-hashes filenames under /assets/, so these are safe to cache
  # forever; a new build produces new filenames instead of overwriting these.
  # No `always` here, deliberately: that flag would also stamp this
  # immutable, one-year Cache-Control onto the =404 below (nginx's default
  # add_header status list -- 200/201/204/206/301-304/307/308 -- excludes
  # 404), which would let a client/CDN cache a miss on a not-yet-built asset
  # path for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
